<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCAL TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Шапка: Название, статус и часы -->
    <header class="app-header">
      <div class="header-brand">
        <span class="tv-logo">●</span>
        <h1>LOCAL TV</h1>
      </div>

      <div class="header-status">
        <div id="status-badge" class="status-badge offline">
          <span class="status-dot"></span>
          <span id="status-text">ОЖИДАНИЕ</span>
        </div>
        <div class="clock" id="live-clock">00:00:00</div>
      </div>
    </header>

    <!-- Основной экран: Плеер + Чат -->
    <main class="main-content">
      <!-- Колонка плеера -->
      <section class="player-column">
        <div class="player-wrapper">
          <video id="tv-player" playsinline webkit-playsinline autoplay muted></video>

          <!-- Кнопка включения звука / старта воспроизведения -->
          <div id="play-prompt-overlay" class="play-prompt-overlay hidden" onclick="handleStartPlayback()">
            <div class="big-play-icon">▶</div>
            <span class="prompt-text">НАЖМИТЕ ДЛЯ ПРОСМОТРА</span>
          </div>

          <!-- Заставка когда эфир выключен -->
          <div id="offline-screen" class="offline-screen">
            <div class="offline-box">
              <div class="radar-pulse"></div>
              <h2>ОЖИДАНИЕ ЭФИРА</h2>
              <p>Трансляция скоро начнется</p>
            </div>
          </div>

          <!-- Панель поверх видео -->
          <div class="player-overlay-bar">
            <div class="player-left-controls">
              <button id="btn-play-toggle" class="icon-btn" title="Старт / Пауза">
                <span id="icon-play">▶</span>
                <span id="icon-pause" class="hidden">❚❚</span>
              </button>
              <div class="volume-control">
                <button id="btn-mute-toggle" class="icon-btn" title="Звук">
                  <span id="icon-vol-on">🔊</span>
                  <span id="icon-vol-off" class="hidden">🔇</span>
                </button>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
              </div>
            </div>

            <div class="player-right-controls">
              <button id="btn-fullscreen" class="icon-btn" title="На весь экран">⛶</button>
            </div>
          </div>

          <!-- Всплывающие реакции -->
          <div id="reactions-layer" class="reactions-layer"></div>
        </div>

        <!-- Быстрые реакции -->
        <div class="reaction-bar">
          <button class="reaction-btn" onclick="sendReaction('🔥')">🔥</button>
          <button class="reaction-btn" onclick="sendReaction('❤️')">❤️</button>
          <button class="reaction-btn" onclick="sendReaction('👍')">👍</button>
          <button class="reaction-btn" onclick="sendReaction('😂')">😂</button>
          <button class="reaction-btn" onclick="sendReaction('🎉')">🎉</button>
          <button class="reaction-btn" onclick="sendReaction('🚀')">🚀</button>
        </div>
      </section>

      <!-- Колонка чата -->
      <aside class="sidebar-column">
        <div class="chat-card">
          <div class="card-header">
            <h3>Чат</h3>
            <span id="viewer-count-tag" class="viewer-tag">1 онлайн</span>
          </div>
          <div id="chat-messages" class="chat-messages"></div>
          <form id="chat-form" class="chat-input-row" onsubmit="handleSendChat(event)">
            <input type="text" id="chat-user-input" class="input-user" placeholder="Имя" value="Зритель" maxlength="15">
            <input type="text" id="chat-text-input" class="input-text" placeholder="Сообщение..." maxlength="180" autocomplete="off" required>
            <button type="submit" class="btn btn-primary">Отправить</button>
          </form>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="config.js"></script>
  <script src="player.js"></script>
</body>
</html>
